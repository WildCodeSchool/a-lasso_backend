spring:
  datasource:
    url: jdbc:mysql://${DB_HOST_PRODUCTION}:${DB_PORT_PRODUCTION}/${DB_NAME_PRODUCTION}?createDatabaseIfNotExist=true
    username: ${DB_USER_PRODUCTION}
    password: ${DB_PASSWORD_PRODUCTION}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: ${JWT_EXP_TIME}

springdoc:
  swagger-ui:
    enabled: false

cors:
  allowedOrigins: ${CLIENT_URL_PRODUCTION}

logging:
  level:
    com.backend_project_template: INFO

custom:
  api-url: ${API_URL_PRODUCTION}
  client-url: ${CLIENT_URL_PROD}

