services:
  alasso-mysql-staging:
    image: mysql:8.0
    container_name: mysql-staging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME_STAGING}
      MYSQL_USER: ${DB_USER_STAGING}
      MYSQL_PASSWORD: ${DB_PASSWORD_STAGING}
    volumes:
      - mysql_data_staging:/var/lib/mysql
    env_file:
      - .env
    networks:
      - traefik

  alasso-spring-app-staging:
    image: alasso/spring-app:staging
    container_name: alasso-spring-staging
    restart: unless-stopped
    depends_on:
      - alasso-mysql-staging
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: staging # Active application-staging.yml
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spring-app-staging.rule=Host(`staging-api.a-l-asso.fr`)"
      - "traefik.http.routers.spring-app-staging.entrypoints=websecure"
      - "traefik.http.routers.spring-app-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.spring-app-staging.loadbalancer.server.port=8080"

volumes:
  mysql_data_staging:

networks:
  traefik:
    external: true
